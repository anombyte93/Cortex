plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def cortexDebugKeystore = file('cortex-debug.keystore')

def generatedOcrAssets = file("$buildDir/generated/cortexOcrAssets")
def arabicOcrModel = file("$generatedOcrAssets/tessdata/ara.traineddata")
def arabicOcrBytes = 1432056L
def arabicOcrSha512 = '7641b0b0e888498aa3fe062d0d44eda9e08d34e46e1c5ef48f92e9a49d2477c0c4cda5f989862d5441d0804312abd81733baa18ef9945c22524f9b106fc4f81d'
def sha512Of = { File f ->
    def digest = java.security.MessageDigest.getInstance('SHA-512')
    f.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int n
        while ((n = input.read(buffer)) > 0) digest.update(buffer, 0, n)
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}
def validArabicOcr = { File f ->
    f.exists() && f.isFile() && f.length() == arabicOcrBytes && sha512Of(f).equalsIgnoreCase(arabicOcrSha512)
}

tasks.register('prepareArabicOcrModel') {
    outputs.file(arabicOcrModel)
    doLast {
        if (!validArabicOcr(arabicOcrModel)) {
            arabicOcrModel.parentFile.mkdirs()
            def tmp = file(arabicOcrModel.absolutePath + '.part')
            if (tmp.exists()) tmp.delete()
            new URL('https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/ara.traineddata').withInputStream { input ->
                tmp.withOutputStream { output -> output << input }
            }
            if (!validArabicOcr(tmp)) {
                def actualBytes = tmp.exists() ? tmp.length() : 0L
                def actualSha = tmp.exists() ? sha512Of(tmp) : 'missing'
                if (tmp.exists()) tmp.delete()
                throw new GradleException("Arabic OCR model integrity check failed: bytes=${actualBytes} sha512=${actualSha}")
            }
            if (arabicOcrModel.exists()) arabicOcrModel.delete()
            if (!tmp.renameTo(arabicOcrModel)) {
                arabicOcrModel.bytes = tmp.bytes
                tmp.delete()
            }
        }
        if (!validArabicOcr(arabicOcrModel)) {
            throw new GradleException('Arabic OCR model failed final integrity verification')
        }
    }
}

android {
    namespace 'com.kareem.cortex'
    compileSdk 35
    buildFeatures { buildConfig true }
    sourceSets { main { assets.srcDir generatedOcrAssets } }

    // The installed Cortex signer is intentionally local-only. A fresh CI checkout falls
    // back to the normal Android debug signer; an update-in-place device build must have
    // app/cortex-debug.keystore present locally and must never regenerate/rotate it.
    signingConfigs {
        cortexPersistentDebug {
            if (cortexDebugKeystore.exists()) {
                storeFile cortexDebugKeystore
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    defaultConfig {
        applicationId 'com.kareem.cortex'
        minSdk 26
        targetSdk 35
        versionCode 54
        versionName '2.0-v54'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testInstrumentationRunnerArguments clearPackageData: 'false'
    }
    buildTypes {
        debug {
            if (cortexDebugKeystore.exists()) signingConfig signingConfigs.cortexPersistentDebug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    packagingOptions { jniLibs { useLegacyPackaging = true } }
}

preBuild.dependsOn tasks.named('prepareArabicOcrModel')

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'dev.ffmpegkit-maintained:llama-android:0.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
}
