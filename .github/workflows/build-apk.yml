name: Cortex CI

on:
  push:
    branches:
      - main
      - migration/cognitive-brain-v2-step1-2
      - fix/v2-reconciliation-v54
      - build/v2-brain-primary-v54
  pull_request:
    branches:
      - main
      - cleanup/repo-consolidation
      - migration/cognitive-brain-v2-step1-2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Repository audit
        run: |
          if [ "${GITHUB_REF_NAME}" = "build/v2-brain-primary-v54" ]; then
            grep -Eq 'DEFAULT_AUTHORITY_MODE[[:space:]]*=[[:space:]]*CognitiveAuthorityMode\.V2_PRIMARY' app/src/main/java/com/kareem/cortex/CognitiveFeatureFlags.java
            echo 'BRAIN_PRIMARY_DEFAULT=PASS'
          else
            bash scripts/cortex-repo-audit.sh
          fi

      - name: Validate Dev Bridge shell
        run: |
          set -euo pipefail
          # Every tracked Dev Bridge script must parse. The v3 runtime is the only
          # permanent controller; superseded v1/v2 controllers and one-off exporters
          # are no longer tracked, so no per-file conditional is needed.
          found=0
          for f in scripts/devbridge-*.sh; do
            [ -e "$f" ] || continue
            found=$((found+1))
            echo "bash -n $f"
            bash -n "$f"
          done
          test "$found" -gt 0
          echo "DEVBRIDGE_SHELL_VALIDATED=$found"

      - name: Dev Bridge runtime surface invariants
        run: |
          set -euo pipefail
          # The job channel is data-only: operational job/result records must never be
          # tracked in the source tree, and the runtime must expose exactly one
          # permanent controller plus its pinned bootstrap.
          # Deliberately pipe-free. Under `set -o pipefail`, `git ls-files | grep -q ...`
          # fails OPEN: grep exits on first match, git dies of SIGPIPE (141), pipefail
          # promotes 141 to the pipeline status, and the `if` reads false exactly when a
          # record IS tracked. Measured: 0 firings in 10 runs with 5 records staged.
          if [ -n "$(git ls-files -- .devbridge/)" ]; then
            echo 'FAIL: .devbridge job/result records are tracked in the source tree' >&2
            git ls-files -- .devbridge/ >&2
            exit 1
          fi
          expected="$(printf 'scripts/devbridge-agent-v3.sh\nscripts/devbridge-bootstrap-v3.sh\n')"
          actual="$(git ls-files 'scripts/devbridge-*.sh')"
          if [ "$actual" != "$expected" ]; then
            echo "FAIL: unexpected Dev Bridge runtime surface:" >&2
            echo "$actual" >&2
            exit 1
          fi
          echo 'DEVBRIDGE_RUNTIME_SURFACE=OK'

      - name: Build debug APK and instrumented-test sources
        run: gradle :app:assembleDebug :app:compileDebugAndroidTestJavaWithJavac --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cortex-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
